name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: npm test
      - run: npm run check
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: git diff --exit-code -- dist/ha-screen-studio.js custom_components/ha_screen_studio/www/ha-screen-studio.js
